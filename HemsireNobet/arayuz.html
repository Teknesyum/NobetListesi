<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<link rel="stylesheet" href="teknesyum-ui/css/theme.css">
<link rel="stylesheet" href="teknesyum-ui/css/a11y.css">
<link rel="stylesheet" href="teknesyum-ui/css/forms.css">
<link rel="stylesheet" href="teknesyum-ui/css/states.css">
<link rel="stylesheet" href="teknesyum-ui/ustcubuk/titlebar.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="cerceve" id="cerceve">

<header class="tk-titlebar" id="basbar">
  <div class="tk-titlebar__brand">
    <img class="basbar-logo" src="simge.png" alt="" width="32" height="32" onerror="this.hidden=true">
    <span class="tk-titlebar__name" id="basbarAd"></span>
    <button type="button" class="basbar-surum" id="basbarSurum" aria-label="update.check" title="Güncellemeleri denetle"></button>
  </div>
  <div class="tk-titlebar__tabs"></div>
  <div class="tk-titlebar__tools">
    <button type="button" class="tk-titlebar__chip tk-titlebar__chip--brand" id="imza"></button>
    <button type="button" class="tk-titlebar__chip tk-titlebar__chip--support" id="destek"></button>
    <div class="tk-titlebar__window" id="pGrup">
      <button type="button" class="tk-titlebar__control" id="pKucult" aria-label="Küçült" title="Küçült"><span class="tk-titlebar__minimize" aria-hidden="true"></span></button>
      <button type="button" class="tk-titlebar__control" id="pBuyult" aria-label="Büyüt" title="Büyüt"><span class="tk-titlebar__maximize" aria-hidden="true"></span></button>
      <button type="button" class="tk-titlebar__control tk-titlebar__control--close" id="pKapat" aria-label="Kapat" title="Kapat"><span class="tk-titlebar__close" aria-hidden="true"></span></button>
    </div>
  </div>
</header>

<div class="kabuk">
  <div class="ipucu-bar" id="ipucuBar" role="status" hidden>Rehberi açmak için <kbd>sağ Ctrl</kbd> tuşunu basılı tut. Fare hangi düğmenin üstündeyse onu ve şimdi ne yapılacağını anlatır.</div>
  <div class="ust">
    <div class="aypanel" role="group" aria-label="Ay Seçimi">
      <button type="button" class="dgm dgm-kare" id="yilGeri" aria-label="Önceki Yıl">‹</button>
      <span class="yil-yazi" id="yilYazi"></span>
      <button type="button" class="dgm dgm-kare" id="yilIleri" aria-label="Sonraki Yıl">›</button>
      <div class="ay-sira" id="aySira"></div>
    </div>
    <span class="bosluk"></span>
    <div class="alan" role="group" aria-labelledby="kisiAd" id="kisiAlan"><span id="kisiAd">Günlük Kişi</span><span class="sayac"><button type="button" class="dgm dgm-kare" id="kisiEksi" aria-label="Günlük kişiyi azalt">−</button><span class="sayac-deger" id="kisi" aria-live="polite"></span><button type="button" class="dgm dgm-kare" id="kisiArti" aria-label="Günlük kişiyi artır">+</button></span></div>
    <span class="durum" id="durum" role="status"></span>
    <button type="button" class="dgm dgm-birincil" id="btnUret">Listeyi Oluştur</button>
    <div class="ilerleme" id="ilerleme" hidden>
      <div class="ilerleme-iz" id="ilerlemeIz" role="progressbar" aria-label="Liste Hazırlanıyor" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="ilerleme-dolgu" id="ilerlemeDolgu"></div></div>
      <span class="ilerleme-yazi" id="ilerlemeYazi"></span>
    </div>
  </div>

  <nav class="sekme-sira" aria-label="Bölümler">
    <div class="ana-sekmeler" role="tablist" aria-label="Ana Bölüm">
      <button type="button" role="tab" class="sekme ana" id="ana-cetele" data-ana="cetele">Genel Çetele</button>
      <button type="button" role="tab" class="sekme ana" id="ana-hazir" data-ana="hazir">Liste Hazırlama</button>
      <button type="button" role="tab" class="sekme ana" id="ana-ayar" data-ana="ayar">Ayarlar</button>
    </div>
    <span class="sekme-ayrac" aria-hidden="true"></span>
    <div class="alt-sekmeler" role="tablist" aria-label="Alt Bölüm" id="altSekmeler">
      <button type="button" role="tab" class="sekme" id="sk-cetele" data-ana="cetele" aria-controls="p-cetele">Genel Çetele</button>
      <button type="button" role="tab" class="sekme" id="sk-istek" data-ana="hazir" aria-controls="p-istek"><span class="adim-no">1</span>İstekler</button>
      <button type="button" role="tab" class="sekme" id="sk-ozel" data-ana="hazir" aria-controls="p-ozel"><span class="adim-no">2</span>Özel Talepler</button>
      <button type="button" role="tab" class="sekme" id="sk-liste" data-ana="hazir" aria-controls="p-liste"><span class="adim-no">3</span>Liste</button>
      <button type="button" role="tab" class="sekme" id="sk-alt" data-ana="hazir" aria-controls="p-alt"><span class="adim-no">4</span>Alternatifler</button>
      <button type="button" role="tab" class="sekme" id="sk-analiz" data-ana="hazir" aria-controls="p-analiz">Analiz</button>
      <button type="button" role="tab" class="sekme" id="sk-sorun" data-ana="hazir" aria-controls="p-sorun"><span class="sekme-ad">Sorunlar</span><span class="rozet" id="sorunRozet" hidden></span></button>
      <button type="button" role="tab" class="sekme" id="sk-kadro" data-ana="ayar" aria-controls="p-kadro">Kadro</button>
      <button type="button" role="tab" class="sekme" id="sk-kural" data-ana="ayar" aria-controls="p-kural">Kurallar</button>
      <button type="button" role="tab" class="sekme" id="sk-ileri" data-ana="ayar" aria-controls="p-ileri">İleri Seviye</button>
      <button type="button" role="tab" class="sekme" id="sk-gecmis" data-ana="ayar" aria-controls="p-gecmis">Geçmiş</button>
      <button type="button" role="tab" class="sekme" id="sk-genel" data-ana="ayar" aria-controls="p-genel">Genel</button>
      <button type="button" role="tab" class="sekme" id="sk-hakkinda" data-ana="ayar" aria-controls="p-hakkinda">Hakkında</button>
    </div>
  </nav>

  <div class="rehber-bar" id="rehberBar" role="status" hidden>
    <span>Liste hazır. Sonraki listelerde rehber yol göstermeye devam etsin mi?</span>
    <button type="button" class="dgm dgm-birincil" id="rehberDevam">Rehberle Devam Et</button>
    <button type="button" class="dgm" id="rehberKapat">Rehberi Kapat</button>
  </div>

  <main class="govde" id="govde" data-mod="tek">
    <section class="pnl liste-pnl" id="listePnl">
      <div class="liste-bas">
        <h1 class="liste-baslik" id="baslik"></h1>
        <p class="oniz-yazi" id="onizYazi" role="status"></p>
        <span class="bosluk"></span>
        <button type="button" class="dgm" id="btnKopya">Excel'e Kopyala</button>
        <button type="button" class="dgm" id="btnCsv">CSV Kaydet</button>
        <button type="button" class="dgm" id="btnYazdir">Yazdır</button>
      </div>
      <div class="liste-kap"><table class="liste" id="liste"></table></div>
    </section>
    <section class="pnl icerik" id="p-cetele" role="tabpanel" aria-labelledby="sk-cetele" hidden></section>
    <section class="pnl icerik" id="p-istek" role="tabpanel" aria-labelledby="sk-istek" hidden></section>
    <section class="pnl icerik" id="p-ozel" role="tabpanel" aria-labelledby="sk-ozel" hidden></section>
    <section class="pnl icerik yan" id="p-liste" role="tabpanel" aria-labelledby="sk-liste" hidden></section>
    <section class="pnl icerik yan" id="p-alt" role="tabpanel" aria-labelledby="sk-alt" hidden></section>
    <section class="pnl icerik" id="p-analiz" role="tabpanel" aria-labelledby="sk-analiz" hidden></section>
    <section class="pnl icerik" id="p-sorun" role="tabpanel" aria-labelledby="sk-sorun" hidden></section>
    <section class="pnl icerik" id="p-kadro" role="tabpanel" aria-labelledby="sk-kadro" hidden></section>
    <section class="pnl icerik" id="p-kural" role="tabpanel" aria-labelledby="sk-kural" hidden></section>
    <section class="pnl icerik" id="p-ileri" role="tabpanel" aria-labelledby="sk-ileri" hidden></section>
    <section class="pnl icerik" id="p-gecmis" role="tabpanel" aria-labelledby="sk-gecmis" hidden></section>
    <section class="pnl icerik" id="p-genel" role="tabpanel" aria-labelledby="sk-genel" hidden></section>
    <section class="pnl icerik" id="p-hakkinda" role="tabpanel" aria-labelledby="sk-hakkinda" hidden></section>
  </main>
</div>
</div>
<div class="gnc-ort" id="gncPanel" role="dialog" aria-modal="true" aria-labelledby="gncBaslik" hidden>
  <div class="gnc-kutu">
    <h2 class="gnc-baslik" id="gncBaslik">Yeni sürüm hazır</h2>
    <p class="gnc-yazi" id="gncYazi"></p>
    <div class="ilerleme-iz" id="gncIz" hidden><div class="ilerleme-dolgu" id="gncDolgu"></div></div>
    <div class="gnc-eylem">
      <button type="button" class="dgm dgm-birincil" id="gncEvet">Güncelle</button>
      <button type="button" class="dgm" id="gncSonra">Sonra</button>
    </div>
  </div>
</div>
<div class="yardim-balon" id="yardimBalon" role="tooltip" hidden><strong class="yardim-baslik" id="yardimBaslik"></strong><span id="yardimMetin"></span><span class="yardim-simdi" id="yardimSimdi"></span></div>
<div class="tk-toast-stack" id="toast" role="status" aria-live="polite"></div>
<script src="veri.js"></script>
<script src="tatil.js"></script>
<script src="motor.js"></script>
<script>
{
const W = window.pencere;
Promise.all([W.veri.hazir(), W.etiket()]).then(([, et]) => {
  window.ETIKET = et || {};
  const s = document.createElement("script");
  s.src = "uygulama.js";
  document.body.append(s);
});
}
</script>
</body>
</html>
